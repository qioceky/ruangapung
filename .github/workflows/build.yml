name: build-ruangapung

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: "Install SDK packages (compileSdk 35)"
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle') }}

      # RuangApung v0.1.0: keystore tetap (JKS) dari secret. Tanpa ini,
      # tiap build memakai debug bawaan dan update tidak bisa menimpa.
      - name: Pulihkan keystore tetap dari secret
        env:
          RUANGAPUNG_KEYSTORE_BASE64: ${{ secrets.RUANGAPUNG_KEYSTORE_BASE64 }}
          RUANGAPUNG_KEYSTORE_PASSWORD: ${{ secrets.RUANGAPUNG_KEYSTORE_PASSWORD }}
          RUANGAPUNG_KEY_ALIAS: ${{ secrets.RUANGAPUNG_KEY_ALIAS }}
          RUANGAPUNG_KEY_PASSWORD: ${{ secrets.RUANGAPUNG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RUANGAPUNG_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret RUANGAPUNG_KEYSTORE_BASE64 belum diisi — build dibatalkan agar tidak bertanda tangan acak."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$RUANGAPUNG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/ruangapung.keystore"
          test -s "$HOME/.android/ruangapung.keystore"
          {
            echo "RUANGAPUNG_STORE_FILE=$HOME/.android/ruangapung.keystore"
            echo "RUANGAPUNG_STORE_PASSWORD=$RUANGAPUNG_KEYSTORE_PASSWORD"
            echo "RUANGAPUNG_KEY_ALIAS=$RUANGAPUNG_KEY_ALIAS"
            echo "RUANGAPUNG_KEY_PASSWORD=$RUANGAPUNG_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Keystore tetap dipulihkan ($(stat -c%s "$HOME/.android/ruangapung.keystore") byte)."

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verifikasi APK (paket, versi, sidik jari penanda tangan)
        env:
          EXPECTED_SHA256: "8F396B65BB953F0A826AC6615C1A142730BCBD5164504BD9CAF8C24381E9D060"
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$APK"
          echo "APK: $APK"
          ls -lh "$APK"
          sha256sum "$APK"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "--- apksigner verify ---"
          "$APKSIGNER" verify --print-certs "$APK"
          FP=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' | tr -d ':' | tr 'a-f' 'A-F')
          echo "Fingerprint SHA-256: $FP"
          test -n "$FP"
          if [ "$FP" != "$EXPECTED_SHA256" ]; then
            echo "::error::Fingerprint ($FP) tidak cocok dengan keystore yang di-pin ($EXPECTED_SHA256)."
            exit 1
          fi
          echo "Fingerprint COCOK dengan keystore yang di-pin."
          echo "--- aapt2 badging ---"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -8

      - uses: actions/upload-artifact@v4
        with:
          name: ruangapung-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
